<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valentins V-Wörter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
/* Layout: eine Spalte wie ein Lernheft – oben Valentin mit Sprechblase, darunter Übungskarten bzw. die aktive Aufgabe */
:root{
  --bg:#f4eff9; --surface:#ffffff; --surface2:#ede5f6; --ink:#2a1f3d; --muted:#6a5f80;
  --plum:#4b2b72; --accent:#c4264f; --f:#c8580f; --w:#0f7d7a; --line:#ddd2ea;
  --ok:#27824a; --okbg:#e3f4e9; --badbg:#fbe5ea; --hl:#ffe9a8;
  --skin:#ece4f7; --hair:#2b1b45; --cape:#3a2160; --lining:#c4264f;
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",sans-serif;
  --read:"Andika","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18122a; --surface:#241b3a; --surface2:#2e2449; --ink:#f2ecfa; --muted:#b4a8cb;
  --plum:#cdb0f5; --accent:#ff6687; --f:#ff9c55; --w:#4fd3c7; --line:#3b2f57;
  --ok:#62d391; --okbg:#1d3a2a; --badbg:#44202d; --hl:#5b4a12;
  --skin:#e6dcf4; --hair:#120a22; --cape:#5a3592; --lining:#ff5c7f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18122a; --surface:#241b3a; --surface2:#2e2449; --ink:#f2ecfa; --muted:#b4a8cb;
  --plum:#cdb0f5; --accent:#ff6687; --f:#ff9c55; --w:#4fd3c7; --line:#3b2f57;
  --ok:#62d391; --okbg:#1d3a2a; --badbg:#44202d; --hl:#5b4a12;
  --skin:#e6dcf4; --hair:#120a22; --cape:#5a3592; --lining:#ff5c7f; color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--read);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;color:var(--plum)}
h1{font-size:1.7rem;line-height:1.1}
h2{font-size:1.35rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Kopfzeile */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);
  border-radius:999px;padding:6px 14px;font-weight:700}
.points{font-family:var(--display);font-size:1.15rem;color:var(--accent);border-color:var(--accent);font-variant-numeric:tabular-nums}
.points.pop{animation:pop .45s ease}
@keyframes pop{50%{transform:scale(1.18)}}

/* Valentin + Sprechblase */
.hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.mascot{width:120px;height:130px}
.mascot svg{width:100%;height:100%;overflow:visible}
.mascot.happy svg{animation:hop .6s ease}
.mascot.sad svg{animation:wobble .6s ease}
@keyframes hop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
@keyframes wobble{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.eyes{animation:blink 5s infinite;transform-origin:60px 58px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mouth-sad{display:none}.mascot.sad .mouth-sad{display:inline}.mascot.sad .mouth-happy{display:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;
  display:flex;gap:10px;align-items:flex-start;min-width:0}
.bubble::before{content:"";position:absolute;left:-12px;top:42%;width:20px;height:20px;background:var(--surface);
  border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble p{margin:0;font-size:1.05rem;flex:1;min-width:0}
@media (max-width:480px){
  .hero{grid-template-columns:84px 1fr;gap:10px}.mascot{width:84px;height:92px}
  .bubble p{font-size:.98rem}
}

.speak{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--plum);background:var(--surface2);
  display:inline-grid;place-items:center;color:var(--plum)}
.speak svg{width:22px;height:22px}
.speak.big{width:58px;height:58px}.speak.big svg{width:30px;height:30px}

/* Übersicht */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;text-align:left;
  display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
button.card:hover{transform:translateY(-2px);border-color:var(--plum)}
.card .num{font-family:var(--display);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card h3{font-size:1.25rem}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.stars{display:flex;gap:3px;margin-top:4px}
.stars svg{width:22px;height:22px}
.star-on{fill:#f2b705}.star-off{fill:var(--line)}
.done-tag{font-size:.85rem;font-weight:700;color:var(--ok)}

.merk{background:var(--surface);border:2px dashed var(--plum);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.merk p{margin:0;color:var(--muted);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:6px 12px;font-size:1.1rem}
.chip mark,.word mark,.gapword mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 2px}

/* Aufgabe */
.stage{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.half{background:#f2b705}.dot.miss{background:var(--accent)}.dot.now{outline:3px solid var(--plum);outline-offset:1px}
.task{font-size:1.05rem;margin:0}
.wordrow{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:12px 0}
.word{font-size:2.6rem;font-weight:700;letter-spacing:.02em;line-height:1.1;overflow-wrap:anywhere}
.gapword .gap{display:inline-block;min-width:1.1em;border-bottom:4px solid var(--plum);text-align:center;color:var(--accent)}
.sentence{font-size:1.25rem;text-align:center;margin:0}
.options{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.opt{min-width:120px;padding:14px 20px;border-radius:16px;border:3px solid var(--line);background:var(--surface2);
  font-size:1.5rem;font-weight:700;font-family:var(--read)}
.opt small{display:block;font-size:.85rem;font-weight:400;color:var(--muted)}
.opt.f{border-color:var(--f)}.opt.w{border-color:var(--w)}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--accent);opacity:.75}
.opt:disabled{cursor:default}
.typebox{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.typebox input{font:inherit;font-size:1.8rem;font-weight:700;padding:10px 14px;border-radius:14px;border:3px solid var(--line);
  background:var(--surface2);color:var(--ink);width:min(320px,100%);text-align:center}
.btn{border:none;border-radius:14px;padding:12px 20px;font-family:var(--display);font-size:1.1rem;background:var(--plum);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--plum);border:2px solid var(--plum)}
.btn.accent{background:var(--accent);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.feedback{border-radius:14px;padding:12px 14px;font-size:1.05rem;display:flex;gap:10px;align-items:center}
.feedback.ok{background:var(--okbg)}.feedback.bad{background:var(--badbg)}
.feedback span{flex:1;min-width:0}
.tipbox{background:var(--surface2);border-left:6px solid #f2b705;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center}
.tipbox span{flex:1;min-width:0}

/* Sortier-Körbe */
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.basket{border-radius:14px;padding:10px 12px;border:2px solid;min-height:70px;min-width:0}
.basket.f{border-color:var(--f)}.basket.w{border-color:var(--w)}
.basket h4{margin:0 0 6px;font-family:var(--display);font-size:1rem}
.basket.f h4{color:var(--f)}.basket.w h4{color:var(--w)}
.basket .chips{gap:5px}.basket .chip{font-size:.95rem;padding:2px 8px}

/* Ergebnis, Code, Feedback */
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.result .stars svg{width:48px;height:48px}
.bigscore{font-family:var(--display);font-size:2.2rem;color:var(--accent);font-variant-numeric:tabular-nums}
.faces{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.face{border:3px solid var(--line);background:var(--surface2);border-radius:16px;padding:8px 14px;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.face b{font-size:2rem;line-height:1}
.face.sel{border-color:var(--plum);background:var(--hl)}
.codebox{font-family:ui-monospace,"Courier New",monospace;font-size:1.9rem;font-weight:700;letter-spacing:.12em;
  background:var(--surface2);border:3px dashed var(--plum);border-radius:14px;padding:8px 18px;user-select:all;color:var(--plum)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel p{margin:0}
.muted{color:var(--muted);font-size:.95rem}
.codein{display:flex;gap:8px;flex-wrap:wrap}
.codein input{font:inherit;font-family:ui-monospace,monospace;font-size:1.2rem;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);flex:1;min-width:0}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700}
details summary{cursor:pointer;font-family:var(--display);color:var(--plum);font-size:1.05rem}
.switch{display:flex;align-items:center;gap:8px;font-size:.95rem}
.switch input{width:20px;height:20px;accent-color:var(--plum)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1>Valentins V-Wörter</h1>
    <div class="top-actions">
      <span class="pill points" id="points" aria-live="polite">0 Punkte</span>
      <button class="pill" id="homeBtn" type="button">Übersicht</button>
      <button class="pill" id="codeBtn" type="button">Mein Code</button>
    </div>
  </div>

  <div class="hero">
    <div class="mascot" id="mascot" aria-hidden="true">
      <svg viewBox="0 0 120 130">
        <path d="M14 128 Q22 78 60 74 Q98 78 106 128 Z" fill="var(--cape)"/>
        <path d="M22 64 L40 82 L60 76 L80 82 L98 64 L92 92 L60 86 L28 92 Z" fill="var(--lining)"/>
        <path d="M48 86 L60 104 L72 86 Z" fill="var(--surface)"/>
        <circle cx="60" cy="96" r="3" fill="var(--lining)"/>
        <path d="M27 48 L18 34 L32 42 Z" fill="var(--skin)"/>
        <path d="M93 48 L102 34 L88 42 Z" fill="var(--skin)"/>
        <ellipse cx="60" cy="56" rx="34" ry="31" fill="var(--skin)"/>
        <path d="M26 50 Q26 18 60 20 Q94 18 94 50 Q86 34 72 36 L60 50 L48 36 Q34 34 26 50 Z" fill="var(--hair)"/>
        <g class="eyes">
          <ellipse cx="47" cy="58" rx="7" ry="8" fill="#fff"/>
          <ellipse cx="73" cy="58" rx="7" ry="8" fill="#fff"/>
          <circle cx="48" cy="60" r="4" fill="#2b1b45"/>
          <circle cx="74" cy="60" r="4" fill="#2b1b45"/>
          <circle cx="49.5" cy="58" r="1.4" fill="#fff"/>
          <circle cx="75.5" cy="58" r="1.4" fill="#fff"/>
        </g>
        <ellipse cx="36" cy="70" rx="5" ry="3" fill="#f3a6bd"/>
        <ellipse cx="84" cy="70" rx="5" ry="3" fill="#f3a6bd"/>
        <g class="mouth-happy">
          <path d="M48 72 Q60 82 72 72" fill="none" stroke="#2b1b45" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M52 74.5 L54.5 80 L57 76 Z" fill="#fff" stroke="#2b1b45" stroke-width=".8"/>
          <path d="M63 76 L65.5 80 L68 74.5 Z" fill="#fff" stroke="#2b1b45" stroke-width=".8"/>
        </g>
        <g class="mouth-sad">
          <path d="M50 78 Q60 71 70 78" fill="none" stroke="#2b1b45" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <div class="bubble">
      <p id="bubbleText">Hallo, ich bin Valentin, der kleine Vampir! In meinem Namen steckt ein V. Komm, wir entdecken zusammen die Wörter mit V!</p>
      <button class="speak" id="bubbleSpeak" type="button" aria-label="Vorlesen"></button>
    </div>
  </div>

  <main id="main"></main>
</div>

<script>
(function(){
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const STAR='<svg viewBox="0 0 24 24"><path class="CLS" d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>';
const $=s=>document.querySelector(s);
const main=$('#main');

/* ---------- Wortmaterial ---------- */
const F_SOUND=['Vater','Vogel','vier','viel','voll','Vorsicht','Veilchen','Vieh','vergessen','vorne','Volk','von'];
const W_SOUND=['Vase','Vulkan','Klavier','Vampir','Vanille','Video','Violine','November','Pullover','Olive','Lava','Ventilator'];
const GAP=[['Vogel','V'],['Fisch','F'],['Vater','V'],['Fenster','F'],['vier','V'],['fünf','F'],['voll','V'],['Fuß','F'],
  ['falsch','F'],['viel','V'],['Vorsicht','V'],['Fahrrad','F'],['vergessen','V'],['Feder','F'],['Veilchen','V'],['Frosch','F'],
  ['von','V'],['Familie','F'],['vorne','V'],['Feuer','F']];
const SPELL=[['Vogel','Fogel','Wogel'],['Vase','Wase','Fase'],['Klavier','Klawier','Klafier'],['Pullover','Pullofer','Pullower'],
  ['Vater','Fater','Vatter'],['Vulkan','Wulkan','Fulkan'],['vier','fier','wier'],['Vanille','Wanille','Fanille'],
  ['Vampir','Wampir','Fampir'],['Veilchen','Feilchen','Weilchen'],['November','Nowember','Nofember'],['Video','Wideo','Fideo'],
  ['viel','fiel','fihl'],['Vorsicht','Forsicht','Worsicht']];
const DICT=[['Vater','Mein ___ kocht heute Nudeln.'],['Vogel','Der ___ singt im Baum.'],['vier','Ein Hund hat ___ Beine.'],
  ['viel','Ich habe heute ___ gelernt.'],['voll','Das Glas ist ganz ___.'],['Vorsicht','___, die Herdplatte ist heiß!'],
  ['vergessen','Ich habe meine Mütze ___.'],['Vase','Die Blumen stehen in der ___.'],['Vulkan','Aus dem ___ fließt Lava.'],
  ['Klavier','Lea spielt ___.'],['Pullover','Im Winter trage ich einen warmen ___.'],['Veilchen','Das ___ ist eine lila Blume.'],
  ['von','Das Geschenk ist ___ Oma.'],['vor','Der Ball liegt ___ dem Tor.'],['Vampir','Valentin ist ein kleiner ___.']];
const MERK=['Vater','Vogel','vier','viel','voll','von','vor','vorne','Vorsicht','Veilchen','Vieh','vergessen','verlieren'];

/* ---------- Zustand ---------- */
const KEY='valentin-v-woerter-1';
let S={points:0,stars:[0,0,0,0],fb:[0,0,0,0],auto:true};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&typeof d.points==='number')S=Object.assign(S,d);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- Vorlesen ---------- */
const canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function speak(text){
  if(!canSpeak||!text)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/___/g,' ... '));
    u.lang='de-DE';u.rate=.82;u.pitch=1.1;
    const v=speechSynthesis.getVoices().find(v=>/^de/i.test(v.lang));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
if(canSpeak){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}catch(e){}}

/* ---------- Valentin ---------- */
let bubbleSay='';
function say(text,mood,read){
  $('#bubbleText').textContent=text;bubbleSay=text;
  const m=$('#mascot');m.classList.remove('happy','sad');void m.offsetWidth;
  if(mood)m.classList.add(mood);
  if(read&&S.auto)speak(text);
}
$('#bubbleSpeak').innerHTML=SPK;
$('#bubbleSpeak').onclick=()=>speak(bubbleSay||$('#bubbleText').textContent);
const PRAISE=['Super gemacht!','Bissfest richtig!','Vampirstark!','Klasse, genau so!','Spitze!','Toll gehört!'];
const OOPS=['Hoppla! Schau noch einmal genau hin.','Fast! Probier es noch einmal.','Nicht schlimm. Hör noch einmal gut zu.'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const markV=w=>w.replace(/[vV]/g,m=>'<mark>'+m+'</mark>');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function addPoints(n){
  if(!n)return;S.points=Math.min(2047,S.points+n);save();updatePoints(true);
}
function updatePoints(anim){
  const p=$('#points');p.textContent=S.points+' Punkte';
  if(anim){p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop');}
}
function starsHTML(n){let h='';for(let i=0;i<3;i++)h+=STAR.replace('CLS',i<n?'star-on':'star-off');return '<div class="stars" aria-label="'+n+' von 3 Sternen">'+h+'</div>';}

/* ---------- Übungen ---------- */
const EX=[
 {name:'Hör-Sortierer',desc:'Klingt das V wie f oder wie w? Sortiere die Wörter.',
  intro:'Hör gut zu! Klingt das V wie f, so wie bei Vogel? Oder wie w, so wie bei Vase?',
  make(){return shuffle([...shuffle(F_SOUND).slice(0,4).map(w=>[w,'f']),...shuffle(W_SOUND).slice(0,4).map(w=>[w,'w'])]).map(([w,s])=>({
    kind:'sort',word:w,answer:s,read:w,
    tip:'Sprich das Wort langsam und laut. Hörst du am V ein f wie bei Vogel oder ein w wie bei Vase?',
    explain:s==='f'?'Bei „'+w+'“ klingt das V wie f.':'Bei „'+w+'“ klingt das V wie w.'}));}},
 {name:'V oder F?',desc:'Setze den richtigen Buchstaben ein.',
  intro:'Hier fehlt der erste Buchstabe. Ist es V oder F? Denk an die Merkwörter!',
  make(){return shuffle(GAP).slice(0,10).map(([w,l])=>({
    kind:'gap',word:w,answer:l,read:w,
    tip:'Die meisten Wörter mit f-Laut schreibt man mit F. Nur Merkwörter wie Vater, Vogel, vier, viel, voll, von und vor schreibt man mit V.',
    explain:l==='V'?'„'+w+'“ ist ein Merkwort. Es wird mit V geschrieben.':'„'+w+'“ schreibt man ganz normal mit F.'}));}},
 {name:'Wörter-Detektiv',desc:'Welches Wort ist richtig geschrieben?',
  intro:'Du bist jetzt Detektiv. Nur ein Wort ist richtig geschrieben. Findest du es?',
  make(){return shuffle(SPELL).slice(0,8).map(a=>({
    kind:'spell',word:a[0],answer:a[0],options:shuffle(a),read:a[0],
    tip:'Alle Wörter klingen gleich. Denk an die Merkwörter mit V. Auch viele Wörter aus anderen Sprachen, wie Vase oder Klavier, schreibt man mit V.',
    explain:'Richtig geschrieben ist: „'+a[0]+'“.'}));}},
 {name:'Hör-Diktat',desc:'Hör das Merkwort und schreibe es auf.',
  intro:'Tippe auf den Lautsprecher und hör genau zu. Dann schreibst du das Wort auf.',
  make(){return shuffle(DICT).slice(0,8).map(([w,s])=>({
    kind:'type',word:w,answer:w,sentence:s,read:w+'. '+s.replace('___',w)+'. '+w+'.',
    tip:'Das Wort fängt mit '+w[0]+' an und hat '+w.length+' Buchstaben.',
    explain:'So schreibt man es: „'+w+'“.'}));}}
];

/* ---------- Übersicht ---------- */
function home(){
  speechStop();R=null;
  let h='<div class="grid">';
  EX.forEach((e,i)=>{
    h+='<button class="card" type="button" data-ex="'+i+'"><span class="num">Übung '+(i+1)+'</span><h3>'+e.name+'</h3><p>'+e.desc+'</p>'+
      (S.stars[i]?starsHTML(S.stars[i])+'<span class="done-tag">Erledigt</span>':'<span class="muted">Noch nicht gespielt</span>')+'</button>';
  });
  h+='</div><section class="merk"><h2>Valentins Merkwörter</h2><p>Diese Wörter schreibt man mit V, obwohl man ein f hört. Tippe ein Wort an, dann liest Valentin es vor.</p><div class="chips">'+
    MERK.map(w=>'<button class="chip" type="button" data-say="'+w+'">'+markV(w)+'</button>').join('')+'</div>'+
    '<p><b>Tipp:</b> Auch die Bausteine <b>ver-</b> und <b>vor-</b> schreibt man immer mit V: <i>verlieren, vergessen, vorlesen, vorne</i>.</p></section>';
  main.innerHTML=h;
  main.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>start(+b.dataset.ex));
  main.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  const done=S.stars.filter(Boolean).length;
  say(done===4?'Wow, du hast alle Übungen geschafft! Du kannst sie nochmal spielen und mehr Punkte sammeln.':
      done?'Schön, dass du wieder da bist! Welche Übung spielst du als Nächstes?':
      'Hallo, ich bin Valentin, der kleine Vampir! In meinem Namen steckt ein V. Wähle eine Übung aus. Für jede richtige Antwort bekommst du Punkte!');
}
function speechStop(){try{canSpeak&&speechSynthesis.cancel();}catch(e){}}

/* ---------- Runde ---------- */
let R=null;
function start(i){
  R={ex:i,items:EX[i].make(),idx:0,earned:0,results:[],sorted:{f:[],w:[]}};
  say(EX[i].intro,null,true);
  item();
}
function item(){
  const it=R.items[R.idx];R.tries=0;R.locked=false;R.tipShown=false;
  const e=EX[R.ex];
  let dots='';R.items.forEach((_,k)=>{const r=R.results[k];dots+='<span class="dot'+(r===2?' ok':r===1?' half':r===0?' miss':'')+(k===R.idx?' now':'')+'"></span>';});
  let body='';
  if(it.kind==='sort'){
    body='<p class="task">Wie klingt das V in diesem Wort?</p><div class="wordrow"><span class="word">'+markV(esc(it.word))+'</span>'+spk()+'</div>'+
      '<div class="options"><button class="opt f" type="button" data-a="f">V wie f<small>wie bei Vogel</small></button><button class="opt w" type="button" data-a="w">V wie w<small>wie bei Vase</small></button></div>'+
      '<div class="baskets"><div class="basket f"><h4>V klingt wie f</h4><div class="chips">'+R.sorted.f.map(w=>'<span class="chip">'+esc(w)+'</span>').join('')+'</div></div>'+
      '<div class="basket w"><h4>V klingt wie w</h4><div class="chips">'+R.sorted.w.map(w=>'<span class="chip">'+esc(w)+'</span>').join('')+'</div></div></div>';
  }else if(it.kind==='gap'){
    const low=it.word[0]===it.word[0].toLowerCase();
    const a=low?'v':'V',b=low?'f':'F';
    body='<p class="task">Hör dir das Wort an. Welcher Buchstabe fehlt?</p><div class="wordrow"><span class="word gapword"><span class="gap" id="gap">?</span>'+esc(it.word.slice(1))+'</span>'+spk()+'</div>'+
      '<div class="options"><button class="opt" type="button" data-a="V">'+a+'</button><button class="opt" type="button" data-a="F">'+b+'</button></div>';
  }else if(it.kind==='spell'){
    body='<p class="task">Hör gut zu. Welches Wort ist richtig geschrieben?</p><div class="wordrow">'+spk()+'</div>'+
      '<div class="options">'+it.options.map(o=>'<button class="opt" type="button" data-a="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';
  }else{
    body='<p class="task">Hör das Wort und schreibe es auf. Denk an groß oder klein!</p><div class="wordrow">'+spk()+'</div>'+
      '<p class="sentence">'+esc(it.sentence).replace('___','<b>______</b>')+'</p>'+
      '<form class="typebox" id="typeForm"><input id="typeIn" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Dein Wort"><button class="btn" type="submit">Prüfen</button></form>';
  }
  main.innerHTML='<section class="stage"><div class="stage-head"><h2>'+e.name+'</h2><div class="dots">'+dots+'</div></div>'+body+
    '<div id="fb" aria-live="polite"></div><div class="row"><button class="btn ghost" type="button" id="tipBtn">Tipp von Valentin</button><button class="btn" type="button" id="nextBtn" hidden>Weiter</button></div>'+
    '<div class="row"><button class="btn ghost" type="button" id="quitBtn">Übung beenden</button></div></section>';
  main.querySelectorAll('.speak[data-read]').forEach(b=>{b.innerHTML=SPK;b.onclick=()=>speak(it.read);});
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.a,b));
  const f=$('#typeForm');if(f){f.onsubmit=ev=>{ev.preventDefault();answer($('#typeIn').value.trim());};setTimeout(()=>{try{$('#typeIn').focus();}catch(e){}},50);}
  $('#tipBtn').onclick=showTip;
  $('#nextBtn').onclick=next;
  $('#quitBtn').onclick=home;
  if(S.auto)setTimeout(()=>speak(it.read),250);
}
function spk(){return '<button class="speak big" type="button" data-read="1" aria-label="Wort vorlesen"></button>';}

function showTip(){
  const it=R.items[R.idx];
  if(!R.tipShown){R.tipShown=true;
    const d=document.createElement('div');d.className='tipbox';d.innerHTML='<span><b>Tipp:</b> '+esc(it.tip)+'</span>';
    const b=document.createElement('button');b.className='speak';b.type='button';b.setAttribute('aria-label','Tipp vorlesen');b.innerHTML=SPK;b.onclick=()=>speak(it.tip);d.appendChild(b);
    $('#fb').before(d);
  }
  say(it.tip,null,true);
}

function answer(a,btn){
  if(R.locked)return;
  const it=R.items[R.idx];
  const maxTries=it.kind==='type'?3:(it.kind==='spell'?2:1);
  if(it.kind==='type'&&!a){fb('bad','Schreib zuerst ein Wort in das Feld.');return;}
  let right=a===it.answer;
  R.tries++;
  if(right){
    const pts=R.tries===1?10:5;
    R.results[R.idx]=R.tries===1?2:1;R.earned+=pts;addPoints(pts);
    if(btn)btn.classList.add('right');
    finishItem(true,'+'+pts+' Punkte! '+it.explain);
    const m=pick(PRAISE);say(m+' Du bekommst '+pts+' Punkte.','happy',true);
    return;
  }
  if(btn){btn.classList.add('wrong');btn.disabled=true;}
  let hint=pick(OOPS);
  if(it.kind==='type'&&a.toLowerCase()===it.answer.toLowerCase())hint='Fast! Die Buchstaben stimmen. Schreibt man das Wort groß oder klein?';
  else if(it.kind==='type'&&R.tries===2)hint='Noch ein Versuch! '+it.tip;
  if(R.tries<maxTries){
    fb('bad',hint);say(hint,'sad',true);
    if(it.kind==='type'){const i=$('#typeIn');i.select();}
    return;
  }
  R.results[R.idx]=0;
  main.querySelectorAll('.opt').forEach(b=>{if(b.dataset.a===it.answer)b.classList.add('right');});
  finishItem(false,'Diesmal nicht. '+it.explain);
  say('Nicht schlimm! '+it.explain+' Beim nächsten Mal klappt es bestimmt.','sad',true);
}
function finishItem(ok,text){
  const it=R.items[R.idx];R.locked=true;
  main.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const ti=$('#typeIn');if(ti)ti.disabled=true;
  const g=$('#gap');if(g)g.textContent=it.word[0];
  if(it.kind==='sort'){R.sorted[it.answer].push(it.word);
    const box=main.querySelector('.basket.'+it.answer+' .chips');box.insertAdjacentHTML('beforeend','<span class="chip">'+esc(it.word)+'</span>');}
  fb(ok?'ok':'bad',text,true);
  $('#tipBtn').hidden=true;
  const n=$('#nextBtn');n.hidden=false;n.textContent=R.idx===R.items.length-1?'Zum Ergebnis':'Weiter';n.focus();
}
function fb(kind,text,withWord){
  const it=R.items[R.idx];
  $('#fb').innerHTML='<div class="feedback '+kind+'"><span>'+esc(text)+'</span></div>';
  if(withWord){const b=document.createElement('button');b.className='speak';b.type='button';b.setAttribute('aria-label','Wort vorlesen');b.innerHTML=SPK;b.onclick=()=>speak(it.word);$('#fb .feedback').appendChild(b);}
}
function next(){R.idx++;if(R.idx<R.items.length)item();else result();}

/* ---------- Ergebnis ---------- */
function result(){
  const max=R.items.length*10,ratio=R.earned/max;
  const st=ratio>=.9?3:ratio>=.65?2:1;
  const i=R.ex;S.stars[i]=Math.max(S.stars[i],st);save();
  const right=R.results.filter(x=>x>0).length;
  main.innerHTML='<section class="stage result"><h2>'+EX[i].name+' geschafft!</h2>'+starsHTML(st)+
    '<div class="bigscore">+'+R.earned+' Punkte</div><p class="muted">Du hattest '+right+' von '+R.items.length+' Aufgaben richtig. Insgesamt hast du jetzt '+S.points+' Punkte.</p>'+
    '<h3>Wie war die Übung für dich?</h3><div class="faces" id="faces">'+
    [[1,'😊','leicht'],[2,'😐','mittel'],[3,'😟','schwer']].map(([v,f,t])=>'<button class="face'+(S.fb[i]===v?' sel':'')+'" type="button" data-v="'+v+'"><b>'+f+'</b>'+t+'</button>').join('')+
    '</div><p class="muted" id="fbThanks">'+(S.fb[i]?'Danke für deine Rückmeldung!':'Tippe auf ein Gesicht.')+'</p>'+
    '<h3>Dein Code</h3><div class="codebox">'+makeCode()+'</div><p class="muted">Schreib dir den Code auf. Er merkt sich deine Punkte, deine Sterne und deine Rückmeldung.</p>'+
    '<div class="row"><button class="btn accent" type="button" id="again">Nochmal spielen</button><button class="btn ghost" type="button" id="back">Zur Übersicht</button></div></section>';
  main.querySelectorAll('.face').forEach(b=>b.onclick=()=>{
    S.fb[i]=+b.dataset.v;save();
    main.querySelectorAll('.face').forEach(x=>x.classList.toggle('sel',x===b));
    $('#fbThanks').textContent='Danke für deine Rückmeldung!';
    main.querySelector('.codebox').textContent=makeCode();
    say(S.fb[i]===3?'Danke, dass du es mir sagst! Übe ruhig noch einmal und nutze die Tipps. Du schaffst das!':S.fb[i]===2?'Danke! Mit etwas Übung wird es immer leichter.':'Toll, dass es dir leicht gefallen hat!','happy',true);
  });
  $('#again').onclick=()=>start(i);$('#back').onclick=home;
  say(st===3?'Fantastisch! Drei Sterne für dich!':st===2?'Gut gemacht! Zwei Sterne. Schaffst du beim nächsten Mal drei?':'Du hast es geschafft! Übe noch einmal, dann bekommst du mehr Sterne.','happy',true);
}

/* ---------- Codes ---------- */
const AL='23456789ABCDEFGHJKLMNPQRSTUVWXYZ',MASK=0x2B5C3A9;
function makeCode(){
  let v=Math.min(2047,S.points);
  S.stars.forEach((s,k)=>v+=s*Math.pow(2,11+2*k));
  S.fb.forEach((f,k)=>v+=f*Math.pow(2,19+2*k));
  v=(v^MASK)>>>0;
  let c='';for(let k=0;k<6;k++){c=AL[v%32]+c;v=Math.floor(v/32);}
  let sum=0;for(let k=0;k<6;k++)sum+=(k+3)*AL.indexOf(c[k]);
  c+=AL[sum%32];
  return 'V-'+c.slice(0,3)+'-'+c.slice(3);
}
function readCode(raw){
  let s=(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/O/g,'0').replace(/I/g,'1');
  if(s.length===8&&s[0]==='V')s=s.slice(1);
  if(s.length!==7)return null;
  for(const ch of s)if(AL.indexOf(ch)<0)return null;
  let sum=0;for(let k=0;k<6;k++)sum+=(k+3)*AL.indexOf(s[k]);
  if(AL[sum%32]!==s[6])return null;
  let v=0;for(let k=0;k<6;k++)v=v*32+AL.indexOf(s[k]);
  if(v>=Math.pow(2,27))return null;
  v=(v^MASK)>>>0;
  const out={points:v&2047,stars:[],fb:[]};
  for(let k=0;k<4;k++)out.stars.push((v>>>(11+2*k))&3);
  for(let k=0;k<4;k++)out.fb.push((v>>>(19+2*k))&3);
  return out;
}
function codePage(){
  speechStop();R=null;
  const code=makeCode();
  main.innerHTML='<div class="panel"><h2>Mein Code</h2><p>Dein Code speichert deine Punkte, deine Sterne und wie du die Übungen fandest. Schreib ihn ins Heft oder zeig ihn deiner Lehrerin oder deinem Lehrer.</p>'+
    '<div class="row"><div class="codebox" id="code">'+code+'</div></div>'+
    '<div class="row"><button class="btn ghost" type="button" id="copy">Code kopieren</button><button class="btn ghost" type="button" id="readC">Code vorlesen</button></div>'+
    '<p class="muted" id="copyMsg"></p></div>'+
    '<div class="panel"><h2>Weiterspielen mit Code</h2><p>Du hast schon einen Code? Gib ihn hier ein, dann geht es mit deinen Punkten weiter.</p>'+
    '<div class="codein"><input id="codeIn" placeholder="V-ABC-DEFG" aria-label="Code eingeben"><button class="btn" type="button" id="load">Code laden</button></div><p class="muted" id="loadMsg"></p></div>'+
    '<div class="panel"><details><summary>Für Lehrkräfte: Code prüfen</summary><div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">'+
    '<p class="muted">Gib den Code eines Kindes ein. Die Übersicht zeigt Punkte, Sterne je Übung und die Selbsteinschätzung des Kindes.</p>'+
    '<div class="codein"><input id="checkIn" placeholder="V-ABC-DEFG" aria-label="Code zum Prüfen"><button class="btn" type="button" id="check">Prüfen</button></div><div id="checkOut"></div></div></details></div>'+
    '<div class="panel"><h2>Einstellungen</h2><label class="switch"><input type="checkbox" id="autoSpeak"'+(S.auto?' checked':'')+'> Valentin liest automatisch vor</label>'+
    (canSpeak?'':'<p class="muted">Dieses Gerät kann leider nicht vorlesen. Probiere einen anderen Browser, zum Beispiel Chrome oder Safari.</p>')+
    '<p class="muted">Der Fortschritt bleibt auf diesem Gerät gespeichert. Mit dem Code geht er auch auf einem anderen Gerät weiter.</p></div>';
  $('#copy').onclick=()=>{
    const done=()=>$('#copyMsg').textContent='Kopiert!';
    try{navigator.clipboard.writeText(code).then(done,()=>sel());}catch(e){sel();}
    function sel(){const r=document.createRange();r.selectNodeContents($('#code'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#copyMsg').textContent='Der Code ist markiert. Du kannst ihn jetzt kopieren.';}
  };
  $('#readC').onclick=()=>speak('Dein Code lautet: '+code.replace(/-/g,' Strich ').split('').join(' '));
  $('#load').onclick=()=>{
    const r=readCode($('#codeIn').value);
    if(!r){$('#loadMsg').textContent='Dieser Code stimmt nicht. Prüfe jeden Buchstaben und jede Zahl.';say('Hmm, der Code passt nicht. Schau noch einmal genau hin.','sad',true);return;}
    S.points=r.points;S.stars=r.stars;S.fb=r.fb;save();updatePoints(true);
    $('#loadMsg').textContent='Geladen! Du hast '+r.points+' Punkte.';
    say('Willkommen zurück! Du hast schon '+r.points+' Punkte gesammelt.','happy',true);
  };
  $('#check').onclick=()=>{
    const r=readCode($('#checkIn').value);
    if(!r){$('#checkOut').innerHTML='<p class="feedback bad"><span>Ungültiger Code. Vermutlich ein Tippfehler.</span></p>';return;}
    const fbT=['–','😊 leicht','😐 mittel','😟 schwer'];
    $('#checkOut').innerHTML='<p><b>'+r.points+' Punkte</b>, '+r.stars.filter(Boolean).length+' von 4 Übungen erledigt.</p><div class="table-wrap"><table><thead><tr><th>Übung</th><th>Sterne</th><th>Einschätzung</th></tr></thead><tbody>'+
      EX.map((e,k)=>'<tr><td>'+e.name+'</td><td>'+(r.stars[k]?'★'.repeat(r.stars[k])+'☆'.repeat(3-r.stars[k]):'nicht gespielt')+'</td><td>'+fbT[r.fb[k]]+'</td></tr>').join('')+'</tbody></table></div>';
  };
  $('#autoSpeak').onchange=e=>{S.auto=e.target.checked;save();};
  say('Hier ist dein Code. Damit kannst du deinen Punktestand festhalten.',null,false);
}

$('#homeBtn').onclick=home;
$('#codeBtn').onclick=codePage;
updatePoints(false);
home();
})();
</script>
</body>
</html>
