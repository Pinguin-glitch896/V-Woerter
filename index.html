<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valentins V-Wörter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
/* Layout: eine Spalte wie ein Lernheft – oben Valentin und Vladimir mit Sprechblase, darunter Kacheln bzw. die aktive Aufgabe.
   Farbwelt nach der Vorlage: Nachthimmel in Dunkelblau, cremefarbene Karten, Rot = Vampir Valentin (V wie W), Blau = Vater Vladimir (V wie F).
   Bewusst eine einzige Farbwelt (kein Hell/Dunkel-Wechsel). */
:root{
  --bg:#1f2a3e; --bg2:#33435f; --surface:#f6f1ea; --surface2:#ebe3d6; --ink:#1e2738; --muted:#5b6476;
  --plum:#26344d; --accent:#c62f35; --line:#d9cfbf;
  --w:#c62f35; --wbg:#f9dcdc; --wglow:#ff6b6b;   /* Valentin: V wie W */
  --f:#2a78c2; --fbg:#d6e8f8; --fglow:#6bb8ff;   /* Vladimir: V wie F */
  --ok:#2e7d4f; --okbg:#e0f1e6; --badbg:#f7e0dc; --hl:#ffe6a3;
  --syl1:#26344d; --syl2:#2f8f4e; --gold:#f2b705;
  --skin:#f3ece6; --hair:#141420; --cape:#1d1b2b; --lining:#8f1d2c;
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",sans-serif;
  --read:"Andika","Verdana",system-ui,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:radial-gradient(900px 520px at 15% -8%,var(--bg2) 0%,transparent 62%),radial-gradient(800px 600px at 105% 35%,#2b3955 0%,transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--ink);font-family:var(--read);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;color:var(--plum)}
h1{font-size:1.7rem;line-height:1.1;color:var(--surface);text-shadow:0 0 14px rgba(255,255,255,.35)}
h1 .v-w{color:#ff8a8a;text-shadow:0 0 12px var(--wglow)}h1 .v-f{color:#8cc8ff;text-shadow:0 0 12px var(--fglow)}
h2{font-size:1.35rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#main{display:flex;flex-direction:column;gap:18px}

/* Kopfzeile */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);
  border-radius:999px;padding:6px 14px;font-weight:700}
.points{font-family:var(--display);font-size:1.15rem;color:var(--accent);border-color:var(--accent);font-variant-numeric:tabular-nums}
.points.pop{animation:pop .45s ease}
.player-pill .ani{font-size:1.3rem;line-height:1}
@keyframes pop{50%{transform:scale(1.18)}}

/* Valentin + Sprechblase */
.hero{display:grid;grid-template-columns:172px 1fr;gap:14px;align-items:center}
.duo{position:relative;width:172px;height:152px}
.duo .mascot{position:absolute;bottom:0}
#dad{right:0;width:104px;height:130px}
#mascot{left:0;width:96px;height:104px;z-index:1}
.mascot svg{width:100%;height:100%;overflow:visible}
.mascot.talk svg{filter:drop-shadow(0 0 10px rgba(255,236,190,.55))}
.who{display:block;font-family:var(--display);font-size:.85rem;letter-spacing:.04em;margin-bottom:2px}
.who.val{color:var(--w)}.who.vlad{color:var(--f)}
.mascot.happy svg{animation:hop .6s ease}
.mascot.sad svg{animation:wobble .6s ease}
@keyframes hop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
@keyframes wobble{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.eyes{animation:blink 5s infinite;transform-origin:60px 58px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mouth-sad{display:none}.mascot.sad .mouth-sad{display:inline}.mascot.sad .mouth-happy{display:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;
  display:flex;gap:10px;align-items:flex-start;min-width:0}
.bubble::before{content:"";position:absolute;left:-12px;top:42%;width:20px;height:20px;background:var(--surface);
  border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble p{margin:0;font-size:1.05rem;flex:1;min-width:0}
@media (max-width:480px){
  .hero{grid-template-columns:116px 1fr;gap:8px}.duo{width:116px;height:108px}
  #dad{width:74px;height:92px}#mascot{width:66px;height:72px}
  .bubble p{font-size:.98rem}
}
.speak{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--plum);background:var(--surface2);
  display:inline-grid;place-items:center;color:var(--plum)}
.speak svg{width:22px;height:22px}
.speak.big{width:58px;height:58px}.speak.big svg{width:30px;height:30px}
.slow{border:2px solid var(--plum);background:var(--surface2);color:var(--plum);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}

/* Übersicht */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
.tile{border:none;border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:16px;text-align:left;color:#fff;
  min-height:104px;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile-0{background:#5b3a9e}.tile-1{background:#2f8f4e}.tile-2{background:#c2571a}.tile-3{background:#1f7a9a}
.tile-4{background:#b8326b}.tile-5{background:#3d4fa8}
.tile-gold{background:linear-gradient(135deg,#d99a00,#f2c230);color:#2a1f3d}
.tile-gold h3{color:#2a1f3d!important}
.tile-icon{flex:none;width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center}
.tile-icon svg{width:50px;height:50px}
.tile-text{display:flex;flex-direction:column;gap:4px;min-width:0}
.tile h3{color:#fff;font-size:1.4rem}
.tile .stars{margin:0}.tile .star-off{fill:rgba(255,255,255,.35)}
.stars{display:flex;gap:3px;margin-top:4px}
.stars svg{width:22px;height:22px}
.star-on{fill:#f2b705}.star-off{fill:var(--line)}

.merk{background:var(--surface);border:2px dashed var(--plum);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:6px 12px 4px;font-size:1.15rem;line-height:1.3}
.chip.again{border-color:var(--accent)}
mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 1px}

/* Silben */
.syl{display:inline-block;position:relative;padding-bottom:7px}
.syl::after{content:"";position:absolute;left:6%;right:6%;bottom:0;height:8px;border:2.5px solid currentColor;border-top:none;border-radius:0 0 50% 50%/0 0 100% 100%}
.syl.s0{color:var(--syl1)}.syl.s1{color:var(--syl2)}
.syl mark{color:inherit}
.nosyl .syl{color:inherit;padding-bottom:0}.nosyl .syl::after{display:none}

/* Aufgabe */
.stage{position:relative;overflow:hidden;border-radius:24px;padding:clamp(130px,17vw,165px) 14px 14px}
.scene{position:absolute;left:0;right:0;top:0;height:300px;z-index:0}
.scene svg{width:100%;height:100%;display:block}
.scene-label{position:absolute;left:14px;top:12px;z-index:1;background:rgba(255,255,255,.88);color:#2a1f3d;border-radius:999px;
  padding:3px 12px;font-family:var(--display);font-size:.85rem;letter-spacing:.04em}
.stage-card{position:relative;z-index:1;background:var(--surface);background:color-mix(in srgb,var(--surface) 94%,transparent);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px;
  box-shadow:0 6px 24px rgba(20,10,40,.18)}
.thumb{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
.thumb-in{display:flex;flex-direction:column;align-items:center;gap:6px;animation:thumbpop 1.7s ease forwards}
.thumb-in svg{width:clamp(120px,30vw,180px);height:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
.thumb-in b{font-family:var(--display);font-size:1.8rem;color:#fff;background:#27824a;border-radius:999px;padding:2px 18px}
@keyframes thumbpop{0%{transform:scale(.2) rotate(-25deg);opacity:0}18%{transform:scale(1.12) rotate(6deg);opacity:1}
  30%{transform:scale(1) rotate(0)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
.autonext{font-size:.9rem;color:var(--muted);text-align:center;margin:6px 0 0}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.half{background:#f2b705}.dot.miss{background:var(--accent)}.dot.now{outline:3px solid var(--plum);outline-offset:1px}
.task{font-size:1.05rem;margin:0}
.again-tag{align-self:flex-start;font-size:.85rem;font-weight:700;color:var(--accent);border:2px solid var(--accent);border-radius:999px;padding:1px 10px}
.wordrow{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:8px 0}
.pic{font-size:3.4rem;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.word{font-size:2.6rem;font-weight:700;letter-spacing:.02em;line-height:1.15;overflow-wrap:anywhere}
.gap{display:inline-block;min-width:1.1em;border-bottom:4px solid var(--plum);text-align:center;color:var(--accent)}
.sentence{font-size:1.25rem;text-align:center;margin:0}
.options{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.opt{min-width:110px;padding:14px 20px;border-radius:16px;border:3px solid var(--line);background:var(--surface2);
  font-size:1.5rem;font-weight:700;font-family:var(--read)}
.opt small{display:block;font-size:.85rem;font-weight:400;color:var(--muted)}
.opt.f{border-color:var(--f)}.opt.w{border-color:var(--w)}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--accent);opacity:.75}
.opt:disabled{cursor:default}
.btn{border:none;border-radius:14px;padding:12px 20px;font-family:var(--display);font-size:1.1rem;background:var(--plum);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--plum);border:2px solid var(--plum)}
.btn.accent{background:var(--accent);color:#fff}
.btn.small{padding:6px 12px;font-size:.95rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.feedback{border-radius:14px;padding:12px 14px;font-size:1.05rem;display:flex;gap:10px;align-items:center}
.feedback.ok{background:var(--okbg)}.feedback.bad{background:var(--badbg)}
.feedback span{flex:1;min-width:0}
.tipbox{background:var(--surface2);border-left:6px solid #f2b705;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center}
.tipbox span{flex:1;min-width:0}

/* Tippen + Bildschirmtastatur */
.typebox{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.typebox input{font:inherit;font-size:1.8rem;font-weight:700;padding:8px 14px;border-radius:14px;border:3px solid var(--line);
  background:var(--surface2);color:var(--ink);width:min(340px,100%);text-align:center}
.kbd{display:flex;flex-direction:column;gap:6px;max-width:620px;width:100%;margin:0 auto}
.kbd-row{display:flex;gap:5px;justify-content:center}
.key{flex:1 1 0;min-width:0;max-width:52px;height:50px;border-radius:10px;border:2px solid var(--line);background:var(--surface);
  font-family:var(--read);font-size:1.3rem;font-weight:700;padding:0;box-shadow:0 2px 0 var(--line)}
.key:active{transform:translateY(2px);box-shadow:none}
.key.wide{max-width:76px;flex-grow:1.5;font-size:1.1rem}
.key.on{background:var(--hl);border-color:var(--plum)}
@media (max-width:420px){.key{height:44px;font-size:1.1rem}.kbd-row{gap:3px}}

/* Blitz-Merker */
.flash{display:flex;flex-direction:column;align-items:center;gap:10px}
.timer{width:min(320px,100%);height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);animation:shrink 5s linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
.covered{font-size:1.3rem;font-weight:700;color:var(--muted);border:3px dashed var(--line);border-radius:16px;padding:16px 26px;background:var(--surface2)}
.compare{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;font-size:1.3rem}
.compare span:nth-child(odd){font-size:.95rem;color:var(--muted)}
.compare b{font-size:2rem}.compare .yours{font-size:2rem;font-weight:700;color:var(--ink)}

/* Sortier-Körbe */
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.basket{border-radius:14px;padding:10px 12px;border:3px solid;min-height:70px;min-width:0}
.basket.f{border-color:var(--f);background:var(--fbg)}.basket.w{border-color:var(--w);background:var(--wbg)}
.basket h4{margin:0 0 6px;font-family:var(--display);font-size:1rem;display:flex;align-items:center;gap:6px}
.basket h4 .face-s{width:30px;height:30px}

/* Laut-Buttons mit Maskottchen (nach der Vorlage: Valentin rot = V wie W, Vladimir blau = V wie F) */
.opt.snd{display:flex;align-items:center;gap:12px;padding:8px 20px 8px 8px;border-radius:999px;border-width:4px;background:#fff;min-width:220px;text-align:left}
.opt.snd-w{border-color:var(--w)}.opt.snd-f{border-color:var(--f)}
.snd-txt{display:flex;flex-direction:column;line-height:1.15}
.snd-txt b{font-size:1.6rem}
.snd-w .snd-txt b{color:var(--w)}.snd-f .snd-txt b{color:var(--f)}
.opt.snd small{font-size:.85rem;color:var(--muted)}
.face-c{flex:none;width:66px;height:66px;border-radius:50%;overflow:hidden;display:grid;place-items:end center}
.face-c svg{width:100%;height:100%}
.face-c.w,.face-s.w{background:var(--w)}.face-c.f,.face-s.f{background:var(--f)}
.face-s{flex:none;display:inline-grid;border-radius:50%;overflow:hidden}
.face-s svg{width:100%;height:100%}
.opt.snd.right{background:var(--okbg);border-color:var(--ok)}
.opt.snd.wrong{opacity:.55}
.word mark.mk-f{background:var(--fbg);color:var(--f);box-shadow:0 0 0 2px var(--f)}
.word mark.mk-w{background:var(--wbg);color:var(--w);box-shadow:0 0 0 2px var(--w)}

/* Merkwörter getrennt nach Valentin und Vladimir */
.merk-groups{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.merk-groups{grid-template-columns:1fr}}
.mg{border-radius:14px;padding:10px 12px;border:3px solid;display:flex;flex-direction:column;gap:8px;min-width:0}
.mg.f{border-color:var(--f);background:var(--fbg)}.mg.w{border-color:var(--w);background:var(--wbg)}
.mg h3{display:flex;align-items:center;gap:8px;font-size:1.1rem}
.mg.f h3{color:var(--f)}.mg.w h3{color:var(--w)}
.mg h3 .face-s{width:40px;height:40px}
.mg .chip{background:#fff}
.basket.f h4{color:var(--f)}.basket.w h4{color:var(--w)}
.basket .chips{gap:5px}.basket .chip{font-size:.95rem;padding:2px 8px}

/* Ergebnis, Code, Feedback */
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.result .stars svg{width:48px;height:48px}
.bigscore{font-family:var(--display);font-size:2.2rem;color:var(--accent);font-variant-numeric:tabular-nums}
.faces{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.face{border:3px solid var(--line);background:var(--surface2);border-radius:16px;padding:8px 14px;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.face b{font-size:2rem;line-height:1}
.face.sel{border-color:var(--plum);background:var(--hl)}
.codebox{font-family:ui-monospace,"Courier New",monospace;font-size:clamp(1.15rem,5.2vw,1.8rem);overflow-wrap:anywhere;max-width:100%;font-weight:700;letter-spacing:.1em;
  background:var(--surface2);border:3px dashed var(--plum);border-radius:14px;padding:8px 18px;user-select:all;color:var(--plum)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel p{margin:0}
.muted{color:var(--muted);font-size:.95rem}
.codein{display:flex;gap:8px;flex-wrap:wrap}
.codein input{font:inherit;font-family:ui-monospace,monospace;font-size:1.2rem;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);flex:1 1 200px;min-width:0}
textarea{font:inherit;font-family:ui-monospace,monospace;font-size:1rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);
  background:var(--surface2);color:var(--ink);width:100%;min-height:130px;resize:vertical}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:700}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
td.hard{background:var(--badbg)}
details summary{cursor:pointer;font-family:var(--display);color:var(--plum);font-size:1.05rem}
.switch{display:flex;align-items:center;gap:8px;font-size:.95rem}
.switch input{width:20px;height:20px;accent-color:var(--plum)}

/* Spieler */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pcard{position:relative;border:3px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pcard .ani{font-size:3rem;line-height:1}
.pcard b{font-size:1.1rem}
.pcard.cur{border-color:var(--plum)}
.pdel{position:absolute;top:4px;right:6px;border:none;background:none;color:var(--muted);font-size:1.2rem;padding:4px 8px}
.animals{display:flex;flex-wrap:wrap;gap:8px}
.animal{font-size:2.2rem;width:64px;height:64px;border-radius:16px;border:3px solid var(--line);background:var(--surface2);padding:0;line-height:1}
.animal.sel{border-color:var(--plum);background:var(--hl)}
.namein{font:inherit;font-size:1.3rem;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);width:min(320px,100%)}
/* Fußzeile */
.foot{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;color:#9fb0cc;font-size:.9rem;padding-top:6px}
.foot button{background:none;border:none;color:#c9d6ea;text-decoration:underline;text-underline-offset:3px;padding:6px 4px;font-size:.9rem}
.legal h3{margin-top:4px}.legal p{max-width:65ch}

/* Lehrkräftebereich */
.t-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.t-out{display:flex;flex-direction:column;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-size:1.5rem;color:var(--plum);font-variant-numeric:tabular-nums}
.kpi span{font-size:.88rem;color:var(--muted)}
.kpi.warn{background:var(--badbg)}.kpi.warn b{color:var(--accent);font-size:1.15rem}
.ex-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.exs{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.exs h3{font-size:1.1rem}.exs p{margin:0;font-size:.93rem}
.bar{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%}
.bar .good{background:#3f9d63}.bar .mid{background:#e0a92b}.bar .low{background:var(--accent)}
.lowlist{color:var(--accent);font-weight:700}
.t-table td.c-good{background:#dcefe2}.t-table td.c-mid{background:#fbefcf}.t-table td.c-low{background:#f6d6d3}
.t-table td.none{color:var(--muted)}
.t-table td small{color:var(--muted)}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.pinbox input{max-width:220px;letter-spacing:.3em;text-transform:none}
.startcode{border-top:2px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.codewarn{margin:0;background:var(--hl);color:var(--ink);border-radius:12px;padding:8px 12px;font-weight:700;max-width:520px}
.confirm{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:.9rem}

/* Schatzkiste */
.chest{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.item .mini{width:90px;height:98px}
.item .mini svg{width:100%;height:100%;overflow:visible}
.item.locked .mini{filter:grayscale(1);opacity:.35}
.item b{font-size:1.05rem}
.item.worn{border-color:var(--ok);background:var(--okbg)}
.progress{height:16px;border-radius:999px;background:var(--surface2);overflow:hidden;border:2px solid var(--line)}
.progress i{display:block;height:100%;background:var(--gold)}

/* Urkunde */
.cert{background:#fffaf0;color:#2a1f3d;border-radius:18px;padding:28px 22px;border:10px double #c79a1c;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.cert h2{font-size:2.4rem;color:#7a1f3d;letter-spacing:.06em}
.cert .who{font-family:var(--display);font-size:2rem;color:#4b2b72}
.cert .mini{width:110px;height:120px}
.cert .mini svg{width:100%;height:100%;overflow:visible}
.cert table{max-width:420px}
.cert td,.cert th{border-color:#e6d6a8;color:#2a1f3d}
.sign{margin-top:8px;display:flex;justify-content:space-between;gap:20px;width:100%;max-width:460px;font-size:.95rem}
.sign span{flex:1;border-top:2px solid #2a1f3d;padding-top:4px}
@media print{.top,.hero,.no-print{display:none!important}body{background:#fff}.cert{border-color:#c79a1c}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

const canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function speak(text,rate,pitch){
  if(!canSpeak||!text)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/___/g,' ... '));
    u.lang='de-DE';u.rate=rate||.82;u.pitch=pitch||1.1;
    const v=speechSynthesis.getVoices().find(v=>/^de/i.test(v.lang));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

  who=who||'val';

function addPoints(n){
  if(!n)return null;const s=S();const before=Math.floor(s.points/100);
  s.points=Math.min(2047,s.points+n);save();updatePoints(true);
  const after=Math.floor(s.points/100);
  return (after>before&&after<=ITEMS.length)?ITEMS[after-1]:null;
}
function updatePoints(anim){
  const p=$('#points');p.textContent=S().points+' Punkte';
  if(anim){p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop');}
}

/* Fehlerwörter: kommen in den nächsten Runden häufiger dran */
function choose(list,n,key){
  const miss=S().miss;
  const missed=shuffle(list.filter(x=>(miss[key(x)]||0)>0)).sort((a,b)=>(miss[key(b)]||0)-(miss[key(a)]||0)).slice(0,Math.ceil(n/2));
  const rest=shuffle(list.filter(x=>missed.indexOf(x)<0)).slice(0,n-missed.length);
  return shuffle(missed.concat(rest));
}
function noteResult(key,firstTry){
  const m=S().miss;
  if(firstTry){if(m[key]){m[key]--;if(!m[key])delete m[key];}}else m[key]=(m[key]||0)+1;
  save();
}

/* ---------- Seiten ---------- */
let R=null;
function leave(){speechStop();if(R)clearTimeout(R.timer),clearTimeout(R.flashT);R=null;}
const allDone=()=>S().stars.every(x=>x>0);

function home(){
  leave();if(!P())return players();
  const s=S();
  let h='<div class="grid">';
  ORDER.forEach(i=>{const e=EX[i];
    h+='<button class="tile tile-'+i+'" type="button" data-ex="'+i+'" aria-label="'+e.name+'"><span class="tile-icon">'+ICONS[i]+'</span>'+
      '<span class="tile-text"><h3>'+e.name+'</h3>'+(s.stars[i]?starsHTML(s.stars[i]):'')+'</span></button>';});
  if(allDone())h+='<button class="tile tile-gold" type="button" id="urkBtn"><span class="tile-icon">'+URK_ICON+'</span><span class="tile-text"><h3>Meine Urkunde</h3></span></button>';
  const chipList=list=>list.map(sy=>{const w=plain(sy);return '<button class="chip'+(s.miss[w]?' again':'')+'" type="button" data-say="'+w+'">'+sylHTML(sy)+'</button>';}).join('');
  h+='</div><section class="merk"><h2>Merkwörter mit V</h2><div class="merk-groups">'+
    '<div class="mg w"><h3>'+faceHTML('val','face-s')+'V wie W</h3><div class="chips">'+chipList(MERK_W)+'</div></div>'+
    '<div class="mg f"><h3>'+faceHTML('vlad','face-s')+'V wie F</h3><div class="chips">'+chipList(MERK_F)+'</div></div></div></section>';
  main.innerHTML=h;
  main.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>start(+b.dataset.ex));
  main.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  const u=$('#urkBtn');if(u)u.onclick=urkunde;
  const done=s.stars.filter(Boolean).length,p=P();
  say(done===NEX?'Wow, '+pname(p)+', du hast alle Übungen geschafft! Deine Urkunde wartet auf dich.':
      done?'Schön, dass du da bist, '+pname(p)+'! Welche Übung spielst du als Nächstes?':
      'Hallo '+pname(p)+'! Ich bin Valentin, der kleine Vampir, und das ist mein Vater Vladimir. Wir streiten uns, wie man das V spricht. Hilfst du uns? Wähle eine Übung aus!');
}

    '<button class="pdel" type="button" data-del="'+p.id+'" aria-label="'+esc(pname(p))+' entfernen">×</button>'+

    '<div class="row" style="justify-content:flex-start"><button class="btn accent" type="button" id="newP">Neu anfangen</button></div>'+
    '<div class="startcode"><p><b>Du hast schon einen Code?</b> Dann gib ihn hier ein und spiel weiter.</p>'+
    '<div class="codein"><input id="startCode" placeholder="V-ABCD-EFGH-JKLM" autocomplete="off" aria-label="Dein Code"><button class="btn" type="button" id="codeP">Mit Code weiterspielen</button></div>'+
    '<p class="muted" id="startMsg"></p></div></div>';

    const s=fresh();applyCode(s,r);
    s.equip=ITEMS.filter((_,k)=>s.points>=(k+1)*100).slice(-1).map(i=>i.id);
    const p={id:'p'+Date.now().toString(36),name:$('#nameIn').value.trim().slice(0,14),ani:(r.ani!=null&&r.ani<ANIMALS.length)?r.ani:sel,s};
    DB.players.push(p);DB.cur=p.id;refresh();home();
    say('Willkommen zurück, '+pname(p)+'! Du hast schon '+r.points+' Punkte gesammelt.','happy',true);
  };
  main.querySelectorAll('[data-ani]').forEach(b=>b.onclick=()=>{sel=+b.dataset.ani;main.querySelectorAll('.animal').forEach(x=>x.classList.toggle('sel',x===b));speak(ANIMALS[sel][1]);});

  main.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.del,card=b.parentNode;const p=DB.players.find(x=>x.id===id);
    const c=document.createElement('div');c.className='confirm';c.innerHTML='<span>'+esc(pname(p))+' wirklich löschen?</span><button class="btn small accent" type="button">Ja</button><button class="btn small ghost" type="button">Nein</button>';
    card.appendChild(c);b.hidden=true;
    c.children[1].onclick=()=>{DB.players=DB.players.filter(x=>x.id!==id);if(DB.cur===id)DB.cur=null;save();refresh();players();};
    c.children[2].onclick=()=>{c.remove();b.hidden=false;};
  });
  $('#newP').onclick=()=>{

  say(DB.players.length?'Wer spielt jetzt? Tippe auf dein Tier oder melde ein neues Kind an.':'Hallo! Ich bin Valentin, der kleine Vampir. Such dir ein Tier aus und schreib deinen Namen dazu. Wenn du schon einen Code hast, gib ihn unten ein.',null,true);

function refresh(){updatePoints(false);updatePlayerBtn();drawMascot();}

/* Schatzkiste */
function chest(){
  leave();if(!P())return players();
  const s=S(),pts=s.points,nextK=ITEMS.findIndex((_,k)=>!unlocked(k));
  let h='<div class="panel"><h2>Valentins Schatzkiste</h2>';
  if(nextK>=0){const need=(nextK+1)*100;h+='<p>Noch <b>'+(need-pts)+' Punkte</b> bis: '+ITEMS[nextK].name+'</p><div class="progress"><i style="width:'+((pts%100))+'%"></i></div>';}
  else h+='<p>Du hast alle Schätze gefunden!</p>';
  h+='</div><div class="chest">'+ITEMS.map((it,k)=>{const un=unlocked(k),worn=s.equip.indexOf(it.id)>=0;
    return '<div class="item'+(un?'':' locked')+(worn?' worn':'')+'"><div class="mini">'+mascotSVG([it.id])+'</div><b>'+it.name+'</b>'+
      (un?'<button class="btn small'+(worn?' ghost':'')+'" type="button" data-eq="'+it.id+'">'+(worn?'Ausziehen':'Anziehen')+'</button>':'<span class="muted">ab '+((k+1)*100)+' Punkten</span>')+'</div>';}).join('')+'</div>';
  main.innerHTML=h;
  main.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{
    const it=ITEMS.find(x=>x.id===b.dataset.eq);
    if(s.equip.indexOf(it.id)>=0)s.equip=s.equip.filter(x=>x!==it.id);
    else{s.equip=s.equip.filter(x=>ITEMS.find(y=>y.id===x).slot!==it.slot);s.equip.push(it.id);}
    save();drawMascot();chest();say(s.equip.indexOf(it.id)>=0?'Schau mal, wie schick ich bin!':'Okay, das ziehe ich wieder aus.','happy',true);
  });
  say('Für je 100 Punkte findest du einen neuen Schatz für mich. Tippe auf Anziehen!',null,false);
}

  const top=window.self===window.top;

    '<div class="who">'+ANIMALS[p.ani][0]+' '+esc(pname(p))+'</div><p>'+(allDone()?'für alle sechs Übungen zu den Wörtern mit V!':'für fleißiges Üben der Wörter mit V!')+'</p>'+
    '<div class="table-wrap" style="width:100%;display:flex;justify-content:center"><table><tbody>'+
    ORDER.map(i=>'<tr><td>'+EX[i].name+'</td><td>'+(s.stars[i]?'★'.repeat(s.stars[i])+'☆'.repeat(3-s.stars[i]):'–')+'</td></tr>').join('')+

/* ---------- Runde ---------- */
function start(i){
  leave();
  R={ex:i,items:EX[i].make(),idx:0,earned:0,results:[],sorted:{f:[],w:[]}};
  const m=S().miss;R.items.forEach(it=>it.again=!!m[it.key]);
  say(EX[i].intro,null,true);
  item();
}
function spk(){return '<button class="speak big" type="button" data-read="1" aria-label="Wort vorlesen"></button>';}
function slowBtn(){return DB.syl?'<button class="slow" type="button" data-slow="1">Silben hören</button>':'';}
function kbdHTML(){
  const rows=['qwertzuiopü','asdfghjklöä','yxcvbnmß'];
  return '<div class="kbd" id="kbd">'+rows.map((r,k)=>'<div class="kbd-row">'+(k===2?'<button class="key wide" type="button" data-k="shift" aria-label="Großbuchstabe">⇧</button>':'')+
    r.split('').map(c=>'<button class="key" type="button" data-k="'+c+'">'+c+'</button>').join('')+
    (k===2?'<button class="key wide" type="button" data-k="back" aria-label="Löschen">⌫</button>':'')+'</div>').join('')+'</div>';
}
function wireTyping(){
  const inp=$('#typeIn');R.shift=false;
  const setShift=v=>{R.shift=v;$('#kbd [data-k="shift"]').classList.toggle('on',v);
    main.querySelectorAll('#kbd [data-k]').forEach(b=>{const k=b.dataset.k;if(k.length===1)b.textContent=v&&k!=='ß'?k.toUpperCase():k;});};
  main.querySelectorAll('#kbd [data-k]').forEach(b=>b.onclick=()=>{
    if(inp.disabled)return;const k=b.dataset.k;
    if(k==='shift')return setShift(!R.shift);
    if(k==='back'){inp.value=inp.value.slice(0,-1);return;}
    inp.value+=R.shift&&k!=='ß'?k.toUpperCase():k;if(R.shift)setShift(false);
  });
  $('#typeForm').onsubmit=ev=>{ev.preventDefault();answer(inp.value.trim());};
}
function item(){
  const it=R.items[R.idx];R.tries=0;R.locked=false;R.tipShown=false;
  const e=EX[R.ex];
  let dots='';R.items.forEach((_,k)=>{const r=R.results[k];dots+='<span class="dot'+(r===2?' ok':r===1?' half':r===0?' miss':'')+(k===R.idx?' now':'')+'"></span>';});
  let body='';
  const typeBox='<form class="typebox" id="typeForm"><input id="typeIn" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Dein Wort"><button class="btn" type="submit">Prüfen</button></form>'+kbdHTML();
  if(it.kind==='sort'){
    body='<p class="task">Wie klingt das V in diesem Wort?</p><div class="wordrow">'+picHTML(it.word)+'<span class="word">'+sylHTML(it.syl)+'</span>'+spk()+slowBtn()+'</div>'+
      '<div class="options">'+
      '<button class="opt snd snd-w" type="button" data-a="w" aria-label="V wie W, Vampir Valentin">'+faceHTML('val','face-c')+'<span class="snd-txt"><b>V wie W</b><small>Vampir Valentin</small></span></button>'+
      '<button class="opt snd snd-f" type="button" data-a="f" aria-label="V wie F, Vater Vladimir">'+faceHTML('vlad','face-c')+'<span class="snd-txt"><b>V wie F</b><small>Vater Vladimir</small></span></button></div>'+
      '<div class="baskets"><div class="basket w"><h4 style="color:var(--w)">'+faceHTML('val','face-s')+'Valentins Wörter</h4><div class="chips">'+R.sorted.w.map(w=>'<span class="chip">'+esc(w)+'</span>').join('')+'</div></div>'+
      '<div class="basket f"><h4 style="color:var(--f)">'+faceHTML('vlad','face-s')+'Vladimirs Wörter</h4><div class="chips">'+R.sorted.f.map(w=>'<span class="chip">'+esc(w)+'</span>').join('')+'</div></div></div>';
  }else if(it.kind==='gap'){
    const low=it.word[0]===it.word[0].toLowerCase();
    body='<p class="task">Hör dir das Wort an. Welcher Buchstabe fehlt?</p><div class="wordrow">'+picHTML(it.word)+'<span class="word">'+sylHTML(it.syl,true)+'</span>'+spk()+'</div>'+
      '<div class="options"><button class="opt" type="button" data-a="V">'+(low?'v':'V')+'</button><button class="opt" type="button" data-a="F">'+(low?'f':'F')+'</button></div>';
  }else if(it.kind==='spell'){
    body='<p class="task">Hör gut zu. Welches Wort ist richtig geschrieben?</p><div class="wordrow">'+picHTML(it.word)+spk()+'</div>'+
      '<div class="options">'+it.options.map(o=>'<button class="opt" type="button" data-a="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';
  }else if(it.kind==='bau'){
    const stemSyl=it.stem.split('-');
    body='<p class="task">Welcher Baustein passt davor?</p><div class="wordrow">'+picHTML(it.word)+'<span class="word"><span class="gap" id="gap" style="min-width:2.2em">?</span>'+
      '<span class="'+(DB.syl?'':'nosyl')+'">'+stemSyl.map((p,k)=>'<span class="syl s'+((k+1)%2)+'">'+markV(p)+'</span>').join('')+'</span></span>'+spk()+'</div>'+
      '<div class="options">'+it.options.map(o=>'<button class="opt" type="button" data-a="'+o+'">'+o+'</button>').join('')+'</div>';
  }else if(it.kind==='type'){
    body='<p class="task">Hör das Wort und schreibe es auf. Denk an groß oder klein!</p><div class="wordrow">'+picHTML(it.word)+spk()+'</div>'+
      '<p class="sentence">'+esc(it.sentence).replace('___','<b>______</b>')+'</p>'+typeBox;
  }else{
    body='<p class="task" id="blitzTask">Lies das Wort und merke es dir gut!</p><div class="flash" id="flash">'+
      '<div class="wordrow">'+picHTML(it.word)+'<span class="word" id="flashWord">'+sylHTML(it.syl)+'</span></div><div class="timer"><i></i></div>'+
      '<button class="btn ghost" type="button" id="gotIt">Ich habe es mir gemerkt</button></div><div id="writeArea" hidden>'+typeBox+'</div>';
  }
  main.innerHTML=stageWrap(R.ex,'<div class="stage-head"><h2>'+e.name+'</h2><div class="dots">'+dots+'</div></div>'+
    (it.again?'<span class="again-tag">Nochmal-Wort</span>':'')+body+
    '<div id="fb" aria-live="polite"></div><div class="row"><button class="btn ghost" type="button" id="tipBtn">Tipp von Valentin</button><button class="btn" type="button" id="nextBtn" hidden>Weiter</button></div>'+
    '<div class="row"><button class="btn ghost" type="button" id="quitBtn">Übung beenden</button></div>');
  main.querySelectorAll('.speak[data-read]').forEach(b=>{b.innerHTML=SPK;b.onclick=()=>speak(it.read);});
  main.querySelectorAll('[data-slow]').forEach(b=>b.onclick=()=>speakSyl(it.syl));
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.a,b));
  if($('#typeForm'))wireTyping();
  $('#tipBtn').onclick=showTip;$('#nextBtn').onclick=next;$('#quitBtn').onclick=home;
  if(it.kind==='blitz'){
    $('#tipBtn').hidden=true;
    $('#gotIt').onclick=coverWord;R.flashT=setTimeout(coverWord,5000);
    if(DB.auto)setTimeout(()=>speak(it.word),250);
  }else if(DB.auto)setTimeout(()=>speak(it.read),250);
}
/* Blitz-Merker: Wort abdecken, dann schreiben */
function coverWord(){
  if(!R||R.locked)return;clearTimeout(R.flashT);
  $('#flash').innerHTML='<div class="covered">Das Wort ist abgedeckt</div>';
  $('#blitzTask').textContent='Schreib das Wort jetzt auf.';
  $('#writeArea').hidden=false;$('#tipBtn').hidden=false;
}
function peekWord(){
  const it=R.items[R.idx];
  $('#flash').innerHTML='<div class="wordrow"><span class="word">'+sylHTML(it.syl)+'</span></div><div class="timer"><i style="animation-duration:3s"></i></div>';
  clearTimeout(R.flashT);R.flashT=setTimeout(()=>{if(R&&!R.locked)$('#flash').innerHTML='<div class="covered">Das Wort ist abgedeckt</div>';},3000);
}

function showTip(){
  const it=R.items[R.idx];
  if(!R.tipShown){R.tipShown=true;
    const d=document.createElement('div');d.className='tipbox';d.innerHTML='<span><b>Tipp:</b> '+esc(it.tip)+'</span>';
    const b=document.createElement('button');b.className='speak';b.type='button';b.setAttribute('aria-label','Tipp vorlesen');b.innerHTML=SPK;b.onclick=()=>speak(it.tip);d.appendChild(b);
    $('#fb').before(d);
  }
  say(it.tip,null,true);
}

function answer(a,btn){
  if(!R||R.locked)return;
  const it=R.items[R.idx];
  const typing=it.kind==='type'||it.kind==='blitz';
  const maxTries=it.kind==='type'?3:(it.kind==='blitz'||it.kind==='spell'||it.kind==='bau')?2:1;
  if(typing&&!a){fb('bad','Schreib zuerst ein Wort in das Feld.');return;}
  R.tries++;
  if(a===it.answer){
    const pts=R.tries===1?10:5;
    R.results[R.idx]=R.tries===1?2:1;R.earned+=pts;noteResult(it.key,R.tries===1);
    const gift=addPoints(pts);
    if(btn)btn.classList.add('right');
    finishItem(true,'+'+pts+' Punkte! '+it.explain+(gift?' Neu in der Schatzkiste: '+gift.name+'!':''));
    const m=pick(PRAISE);
    if(it.kind==='sort'&&!gift){
      const owner=it.answer==='f'?'vlad':'val';
      const line=m+' „'+it.word+'“ ist mein Wort. Da klingt das V wie '+(owner==='vlad'?'F':'W')+'!';
      say(line,'happy',false,owner);if(DB.auto)speakAs(line,owner);
    }else{
      say(gift?m+' Und schau mal: In der Schatzkiste wartet ein neuer Schatz für mich: '+gift.name+'!':m+' Du bekommst '+pts+' Punkte.','happy',false);
      if(DB.auto)speak(gift?m+' Ein neuer Schatz: '+gift.name+'!':m);
    }
    const t=$('#thumb');t.innerHTML='<div class="thumb-in">'+THUMB+'<b>+'+pts+'</b></div>';t.hidden=false;
    $('#nextBtn').hidden=true;
    const last=R.idx===R.items.length-1;
    $('#fb').insertAdjacentHTML('beforeend','<p class="autonext">'+(last?'Gleich siehst du dein Ergebnis …':'Gleich geht es automatisch weiter …')+'</p>');
    clearTimeout(R.timer);R.timer=setTimeout(next,gift?3200:1900);
    return;
  }
  if(btn){btn.classList.add('wrong');btn.disabled=true;}
  let hint=pick(OOPS);
  if(typing&&a.toLowerCase()===it.answer.toLowerCase())hint='Fast! Die Buchstaben stimmen. Schreibt man das Wort groß oder klein?';
  else if(it.kind==='type'&&R.tries===2)hint='Noch ein Versuch! '+it.tip;
  else if(it.kind==='blitz')hint='Schau dir das Wort noch einmal genau an. Dann versuch es nochmal.';
  if(R.tries<maxTries){
    fb('bad',hint);say(hint,'sad',true);
    if(it.kind==='blitz')peekWord();
    if(typing){const i=$('#typeIn');i.value='';}
    return;
  }
  R.results[R.idx]=0;noteResult(it.key,false);
  main.querySelectorAll('.opt').forEach(b=>{if(b.dataset.a===it.answer)b.classList.add('right');});
  if(typing){$('#fb').dataset.yours=a;}

/* ---------- Codes ----------
   Aktuell (12 Zeichen, V-XXXX-XXXX-XXXX): 11 Datenzeichen = 55 Bit, plus Prüfzeichen.
   Punkte/5 (9 Bit) | je Übung: Fehler in bester Runde 0–7 (3 Bit), Runden 0–3 (2 Bit), Einschätzung (2 Bit) | Tier (4 Bit)
   Ältere Codes (8 und 7 Zeichen) werden weiter gelesen, liefern aber nur Sterne. */
const AL='23456789ABCDEFGHJKLMNPQRSTUVWXYZ',MASK1=0x2B5C3A9,MASK2=BigInt('0x5A3C96B2D'),MASK3=BigInt('0x5B2D19C3A6E47');
function checkChar(c){let sum=0;for(let k=0;k<c.length;k++)sum+=(k+3)*AL.indexOf(c[k]);return AL[sum%32];}
function makeCode(s,ani){
  if(ani==null)ani=P()?P().ani:0;
  let v=BigInt(Math.min(511,Math.round(s.points/5)));let sh=9n;
  for(let k=0;k<NEX;k++){
    const played=s.rounds[k]>0;
    v|=BigInt(played?Math.min(7,Math.max(0,s.err[k])):0)<<sh;sh+=3n;
    v|=BigInt(Math.min(3,s.rounds[k]))<<sh;sh+=2n;
    v|=BigInt(s.fb[k]&3)<<sh;sh+=2n;
  }
  v|=BigInt(ani&15)<<sh;
  v^=MASK3;
  let c='';for(let k=0;k<11;k++){c=AL[Number(v%32n)]+c;v/=32n;}
  c+=checkChar(c);
  return 'V-'+c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8);
}
function decodeV3(s){
  if(s.length!==12)return null;for(const ch of s)if(AL.indexOf(ch)<0)return null;
  if(checkChar(s.slice(0,11))!==s[11])return null;
  let v=0n;for(let k=0;k<11;k++)v=v*32n+BigInt(AL.indexOf(s[k]));
  v^=MASK3;
  const get=n=>{const x=Number(v&((1n<<BigInt(n))-1n));v>>=BigInt(n);return x;};
  const out={points:get(9)*5,err:[],rounds:[],fb:[],stars:[]};
  for(let k=0;k<NEX;k++){const e=get(3),r=get(2),f=get(2);out.rounds.push(r);out.err.push(r?e:-1);out.fb.push(f);out.stars.push(starsFromErr(r?e:-1));}
  out.ani=get(4);
  if(out.ani>=ANIMALS.length)return null;
  return out;
}
function fromStars(points,stars,fb){
  const errFor={3:1,2:3,1:5};
  return {points,stars,fb,legacy:true,rounds:stars.map(x=>x?1:0),err:stars.map(x=>x?errFor[x]:-1)};
}
function decodeNew(s){
  if(s.length!==8)return null;for(const ch of s)if(AL.indexOf(ch)<0)return null;
  if(checkChar(s.slice(0,7))!==s[7])return null;
  let v=0n;for(let k=0;k<7;k++)v=v*32n+BigInt(AL.indexOf(s[k]));
  v^=MASK2;
  const stars=[],fb=[];
  for(let k=0;k<NEX;k++){stars.push(Number((v>>BigInt(11+2*k))&3n));fb.push(Number((v>>BigInt(23+2*k))&3n));}
  return fromStars(Number(v&2047n),stars,fb);
}
function decodeOld(s){
  if(s.length!==7)return null;for(const ch of s)if(AL.indexOf(ch)<0)return null;
  if(checkChar(s.slice(0,6))!==s[6])return null;
  let v=0;for(let k=0;k<6;k++)v=v*32+AL.indexOf(s[k]);
  if(v>=Math.pow(2,27))return null;
  v=(v^MASK1)>>>0;
  const stars=[0,0,0,0,0,0],fb=[0,0,0,0,0,0];
  for(let k=0;k<4;k++){stars[k]=(v>>>(11+2*k))&3;fb[k]=(v>>>(19+2*k))&3;}
  return fromStars(v&2047,stars,fb);
}
function readCode(raw){
  const s=(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const tries=[];
  if(s.length===13&&s[0]==='V')tries.push(()=>decodeV3(s.slice(1)));
  if(s.length===12)tries.push(()=>decodeV3(s));
  if(s.length===9&&s[0]==='V')tries.push(()=>decodeNew(s.slice(1)));
  if(s.length===8){tries.push(()=>decodeNew(s));if(s[0]==='V')tries.push(()=>decodeOld(s.slice(1)));}
  if(s.length===7)tries.push(()=>decodeOld(s));
  for(const t of tries){const r=t();if(r)return r;}
  return null;
}

/* ---------- Lehrkräftebereich ----------
   Schutz per PIN. Gespeichert ist nur ein SHA-256-Fingerabdruck der PIN, nicht die PIN selbst.
   Das hält Kinder fern, ist aber kein Schutz gegen Fachleute: Die Seite läuft komplett im Browser. */
const PIN_HASH='e70b1d4f5efc615b2f8319140f18e582552974bc313045e0399e97868794f97c';
let teacherOpen=false,pinFails=0,pinLockUntil=0,classText='';
async function sha256(t){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function teacherGate(){
  leave();
  if(teacherOpen)return teacher();
  main.innerHTML='<div class="panel pinbox"><h2>Bereich für Lehrkräfte</h2><p>Bitte gib die PIN ein.</p>'+
    '<form class="codein" id="pinForm"><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="PIN"><button class="btn" type="submit">Öffnen</button></form>'+
    '<p class="muted" id="pinMsg"></p><div class="row" style="justify-content:flex-start"><button class="btn ghost small" type="button" id="pinBack">Zurück</button></div></div>';
  $('#pinBack').onclick=home;
  setTimeout(()=>{try{$('#pinIn').focus();}catch(e){}},50);
  $('#pinForm').onsubmit=async ev=>{
    ev.preventDefault();
    const msg=$('#pinMsg');
    if(Date.now()<pinLockUntil){msg.textContent='Zu viele Versuche. Bitte warte '+Math.ceil((pinLockUntil-Date.now())/1000)+' Sekunden.';return;}
    if(!(window.crypto&&crypto.subtle)){msg.textContent='Dieser Browser kann die PIN hier nicht prüfen. Öffne die App über die Internetadresse (https).';return;}
    const h=await sha256('valentin-v-lehrkraft:'+$('#pinIn').value.trim());
    if(h===PIN_HASH){teacherOpen=true;pinFails=0;teacher();return;}
    pinFails++;$('#pinIn').value='';
    if(pinFails>=5){pinLockUntil=Date.now()+60000;pinFails=0;msg.textContent='Zu viele falsche Versuche. Bitte warte eine Minute.';}
    else msg.textContent='Die PIN stimmt nicht.';
  };
}
function teacher(){
  leave();
  main.innerHTML='<div class="panel"><div class="t-head"><h2>Klassenauswertung</h2><button class="btn ghost small" type="button" id="tLock">Bereich schließen</button></div>'+
    '<p class="muted">Eine Zeile pro Kind, zum Beispiel <code>Mia: V-ABCD-EFGH-JKLM</code>. Der Name ist freiwillig. Ohne Namen zeigt die Auswertung das Tier des Kindes. Ältere, kürzere Codes werden erkannt, liefern aber nur Sterne.</p>'+
    '<textarea id="classIn" aria-label="Codes der Klasse" placeholder="Mia: V-ABCD-EFGH-JKLM&#10;Tom: V-…">'+esc(classText)+'</textarea>'+
    '<div class="row" style="justify-content:flex-start"><button class="btn" type="button" id="check">Auswerten</button></div></div><div id="checkOut" class="t-out"></div>';
  $('#tLock').onclick=()=>{teacherOpen=false;classText='';home();};
  $('#check').onclick=()=>{classText=$('#classIn').value;classReport(classText);};
  if(classText)classReport(classText);
  say('Hier ist der Bereich für Lehrkräfte.',null,false,'vlad');
}
const FOCUS=['Laute unterscheiden: V wie F oder V wie W','Merkwörter: V oder F am Wortanfang','Richtige Schreibweise erkennen','Merkwörter nach Gehör schreiben, auch Groß und Klein','Wortbausteine ver- und vor-','Merkwörter aus dem Gedächtnis schreiben'];
const SHORT=['Hör-Sortierer','V oder F?','Detektiv','Hör-Diktat','Baumeister','Blitz-Merker'];
function classReport(text){
  const rows=[];const bad=[];
  text.split(/[\r\n]+/).forEach(line=>{
    if(!line.trim())return;
    const m=line.match(/V-?[A-Za-z0-9]{3,4}-?[A-Za-z0-9]{4}(?:-?[A-Za-z0-9]{4})?/i);
    const r=m?readCode(m[0]):null;
    if(!r){bad.push(line.trim());return;}
    const typed=line.replace(m[0],'').replace(/[:;,|=\t]+/g,' ').trim();
    const name=typed||(r.ani!=null?ANIMALS[r.ani][1]+' '+ANIMALS[r.ani][0]:'Kind '+(rows.length+1));
    rows.push({name,r});
  });
  const out=$('#checkOut');
  if(!rows.length){out.innerHTML='<div class="panel"><p class="feedback bad"><span>Ich habe keinen gültigen Code gefunden. Prüfe die Schreibweise.</span></p></div>';return;}
  const N=rows.length,fbT=['','😊','😐','😟'],fbW=['','leicht','mittel','schwer'];
  const right=e=>8-e;
  const lvl=e=>e<0?'':e<=1?'good':e<=3?'mid':'low';
  /* Übersicht je Übung */
  const sum=ORDER.map(i=>{
    const pl=rows.filter(x=>x.r.rounds[i]>0&&!x.r.legacy);
    const avg=pl.length?pl.reduce((a,x)=>a+right(x.r.err[i]),0)/pl.length:0;
    return {i,played:pl.length,avg,hard:rows.filter(x=>x.r.fb[i]===3).length,
      low:pl.filter(x=>x.r.err[i]>=4).map(x=>x.name),open:rows.filter(x=>!x.r.rounds[i]).map(x=>x.name)};
  });
  const avgPts=Math.round(rows.reduce((a,x)=>a+x.r.points,0)/N);
  const done=rows.filter(x=>x.r.rounds.every(r=>r>0)).length;
  const worst=sum.filter(a=>a.played).sort((a,b)=>(a.avg-b.avg)||(b.hard-a.hard))[0];
  let h='<div class="panel"><h2>Auf einen Blick</h2><div class="kpis">'+
    '<div class="kpi"><b>'+N+'</b><span>Kinder</span></div>'+
    '<div class="kpi"><b>'+avgPts+'</b><span>Ø Punkte</span></div>'+
    '<div class="kpi"><b>'+done+' / '+N+'</b><span>haben alle Übungen gemacht</span></div>'+
    (worst?'<div class="kpi warn"><b>'+EX[worst.i].name+'</b><span>am schwersten (Ø '+worst.avg.toFixed(1).replace('.',',')+' von 8 richtig)</span></div>':'')+
    '</div>'+(bad.length?'<p class="muted">Nicht erkannt: '+bad.map(esc).join(' · ')+'</p>':'')+'</div>';
  /* Übungen */
  h+='<div class="panel"><h2>Übungen</h2><div class="ex-sum">'+sum.map(a=>
    '<div class="exs"><h3>'+EX[a.i].name+'</h3><p class="muted">'+FOCUS[a.i]+'</p>'+
    '<div class="bar" title="Ø richtig"><i class="'+(a.avg>=6.5?'good':a.avg>=4.5?'mid':'low')+'" style="width:'+(a.avg/8*100).toFixed(0)+'%"></i></div>'+
    '<p><b>'+(a.played?a.avg.toFixed(1).replace('.',',')+' von 8':'–')+'</b> richtig im Schnitt · gespielt von '+rows.filter(x=>x.r.rounds[a.i]>0).length+' / '+N+' · '+a.hard+'× „schwer“</p>'+
    (a.low.length?'<p class="lowlist">Unter 5 richtig: '+a.low.map(esc).join(', ')+'</p>':'')+
    (a.open.length&&a.open.length<N?'<p class="muted">Noch nicht gespielt: '+a.open.map(esc).join(', ')+'</p>':'')+
    '</div>').join('')+'</div></div>';
  /* Tabelle */
  h+='<div class="panel"><div class="t-head"><h2>Alle Kinder</h2><button class="btn ghost small" type="button" id="copyTab">Tabelle für Excel kopieren</button></div>'+
    '<p class="muted">Pro Übung: richtige Aufgaben in der besten Runde von 8 · Anzahl Runden · Selbsteinschätzung. Grün 7–8, gelb 5–6, rot 0–4.</p>'+
    '<div class="table-wrap"><table class="t-table"><thead><tr><th>Kind</th><th>Punkte</th>'+ORDER.map(i=>'<th>'+SHORT[i]+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(x=>'<tr><td>'+esc(x.name)+(x.r.legacy?' <span class="muted">(alter Code)</span>':'')+'</td><td>'+x.r.points+'</td>'+ORDER.map(i=>{
      const e=x.r.err[i],r=x.r.rounds[i];
      if(!r)return '<td class="none">–'+(x.r.fb[i]?' '+fbT[x.r.fb[i]]:'')+'</td>';
      const txt=x.r.legacy?'★'.repeat(x.r.stars[i]):(right(e)+'/8');
      return '<td class="c-'+lvl(e)+'"><b>'+txt+'</b> <small>'+(x.r.legacy?'':(r>=3?'3+':r)+'×')+'</small> '+fbT[x.r.fb[i]]+'</td>';}).join('')+'</tr>').join('')+
    '</tbody></table></div><p class="muted" id="copyTabMsg"></p></div>';
  /* Förderhinweise */
  const tips=rows.map(x=>{
    const need=ORDER.filter(i=>x.r.rounds[i]>0&&((!x.r.legacy&&x.r.err[i]>=4)||(x.r.legacy&&x.r.stars[i]===1)||x.r.fb[i]===3));
    const open=ORDER.filter(i=>!x.r.rounds[i]);
    return {x,need,open};
  }).filter(t=>t.need.length||t.open.length);
  h+='<div class="panel"><h2>Förderhinweise</h2>'+(tips.length?'<ul class="tips">'+tips.map(t=>
    '<li><b>'+esc(t.x.name)+'</b>'+
    (t.need.length?'<br>Üben: '+t.need.map(i=>FOCUS[i]+' ('+EX[i].name+(t.x.r.fb[i]===3?', selbst „schwer“':'')+')').join('; '):'')+
    (t.open.length?'<br><span class="muted">Noch offen: '+t.open.map(i=>EX[i].name).join(', ')+'</span>':'')+'</li>').join('')+'</ul>':'<p>Alle Kinder haben alle Übungen gut geschafft.</p>')+'</div>';
  out.innerHTML=h;
  $('#copyTab').onclick=()=>{
    const head=['Kind','Punkte'].concat(ORDER.flatMap(i=>[SHORT[i]+' richtig',SHORT[i]+' Runden',SHORT[i]+' Einschätzung']));
    const lines=[head.join('\t')].concat(rows.map(x=>[x.name,x.r.points].concat(ORDER.flatMap(i=>{
      const r=x.r.rounds[i];return [r&&!x.r.legacy?right(x.r.err[i]):'',r?(r>=3?'3+':r):0,fbW[x.r.fb[i]]];})).join('\t')));
    const t=lines.join('\n');
    const ok=()=>$('#copyTabMsg').textContent='Kopiert! In Excel oder Numbers einfach einfügen.';
    try{navigator.clipboard.writeText(t).then(ok,()=>{$('#copyTabMsg').textContent='Kopieren ging nicht. Markiere die Tabelle und kopiere sie von Hand.';});}
    catch(e){$('#copyTabMsg').textContent='Kopieren ging nicht. Markiere die Tabelle und kopiere sie von Hand.';}
  };
}
